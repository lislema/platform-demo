name: "Architecture Decision"
description: "Propose or record an architecture decision"
title: "[Architecture]: "

labels:
  - "type:architecture"

body:

  - type: markdown
    attributes:
      value: |
        # Architecture Decision

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header (Common to ALL Issue Types)
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the business priority.
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      description: Select the primary component affected.
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Architecture Decision
  ######################################################################

  - type: input
    id: decision_title
    attributes:
      label: Decision Title
      placeholder: Adopt GitHub Actions for CI/CD
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the background and problem being addressed.
      placeholder: |
        Explain the current situation and why a decision is required.
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: Clearly define the problem.
      placeholder: |
        Describe the architectural problem.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed architecture or design.
      placeholder: |
        Describe the recommended solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions that were evaluated.
      placeholder: |
        Option 1

        Option 2

        Option 3

  - type: textarea
    id: advantages
    attributes:
      label: Advantages
      placeholder: |
        Why is this the preferred solution?

  - type: textarea
    id: disadvantages
    attributes:
      label: Risks / Disadvantages
      placeholder: |
        Technical risks

        Operational risks

        Cost implications

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      placeholder: |
        List important assumptions.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: |
        Other systems

        Teams

        Projects

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Approach
      description: Describe how this decision will be implemented.
      placeholder: |
        High-level implementation steps.

  - type: textarea
    id: consequences
    attributes:
      label: Expected Consequences
      description: Describe the expected outcomes of adopting this decision.
      placeholder: |
        Positive outcomes

        Negative outcomes

        Long-term considerations

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to ADRs, design documents, RFCs or external references.

  ######################################################################
  # Approval
  ######################################################################

  - type: checkboxes
    id: approval
    attributes:
      label: Architecture Checklist
      options:
        - label: Alternatives have been evaluated
        - label: Risks have been documented
        - label: Security implications reviewed
        - label: Operational impact assessed
        - label: Implementation approach defined
        - label: Stakeholders consulted
