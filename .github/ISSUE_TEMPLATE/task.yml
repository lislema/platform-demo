name: "Task"
description: "Create a development task"
title: "[Task]: "

labels:
  - "type:task"

body:

  - type: markdown
    attributes:
      value: |
        # Development Task

        Complete all mandatory fields before submitting.

        This form captures the business and technical requirements for a development task.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the task.
      placeholder: Implement OAuth token refresh
    validations:
      required: true

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID, username or requester identifier.
      placeholder: john.doh@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the work to be completed.
      placeholder: |
        Describe the implementation in sufficient detail.
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Explain why this work is required.
      placeholder: |
        Describe the business or technical value delivered by this task.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met before this task is considered complete.
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      description: Select the primary component affected.
      options:
        - component:api
        - component:backend
        - component:database
        - component:ui
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:other
        - component:documentation
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List related issues, blockers or prerequisites.
      placeholder: |
        Depends on #123

        Blocked by #456

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: Describe the technical implementation, architecture changes or references.
      placeholder: |
        API changes

        Database changes

        ADR references

        Design documents

        External documentation

  - type: textarea
    id: testing
    attributes:
      label: Test Plan
      description: Describe how this work will be validated.
      placeholder: |
        Unit Tests

        Integration Tests

        Manual Tests

        Performance Tests

        Security Tests

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: Confirm the completion criteria.
      options:
        - label: Code implemented
        - label: Code reviewed
        - label: Unit tests completed
        - label: Integration tests completed
        - label: Documentation updated
        - label: Security review completed
        - label: Acceptance criteria satisfied
