name: "Epic"
description: "Create a large body of work comprising multiple Features"
title: "[Epic]: "

labels:
  - "type:epic"

body:

  - type: markdown
    attributes:
      value: |
        # Epic

        An Epic represents a significant business or technical initiative that will
        be delivered through one or more Features.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Epic Details
  ######################################################################

  - type: textarea
    id: vision
    attributes:
      label: Vision
      description: Describe the overall objective of the Epic.
    validations:
      required: true

  - type: textarea
    id: business_problem
    attributes:
      label: Business Problem
      description: What business or technical problem is this Epic solving?
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Describe the expected business value.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what is included within the Epic.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Clearly state what is NOT included.

  - type: textarea
    id: success_criteria
    attributes:
      label: Success Criteria
      description: How will success be measured?
    validations:
      required: true

  - type: textarea
    id: major_features
    attributes:
      label: Major Features
      description: List the Features that will deliver this Epic.
      placeholder: |
        Feature 1

        Feature 2

        Feature 3

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List dependencies on other projects, teams or systems.

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Identify key business or technical risks.

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      description: List assumptions made during planning.

  ######################################################################
  # Completion Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Epic Checklist
      options:
        - label: Business problem defined
        - label: Business value documented
        - label: Scope agreed
        - label: Success criteria defined
        - label: Features identified
        - label: Dependencies documented
        - label: Risks reviewed
