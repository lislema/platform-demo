name: "Feature"
description: "Create a new business or technical capability"
title: "[Feature]: "

labels:
  - "type:feature"

body:

  - type: markdown
    attributes:
      value: |
        # Feature

        A Feature represents a new business or technical capability that contributes
        to an Epic and is implemented through one or more User Stories.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Feature Details
  ######################################################################

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Summary
      description: Provide a concise description of the feature.
    validations:
      required: true

  - type: textarea
    id: business_problem
    attributes:
      label: Business Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Describe the expected business value.
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the capability being delivered.
    validations:
      required: true

  - type: textarea
    id: functional_requirements
    attributes:
      label: Functional Requirements
      description: List the functional requirements.
      placeholder: |
        FR-001

        FR-002

        FR-003
    validations:
      required: true

  - type: textarea
    id: non_functional_requirements
    attributes:
      label: Non-functional Requirements
      description: Performance, security, availability, scalability, compliance, etc.
      placeholder: |
        Performance

        Security

        Availability

        Scalability

        Compliance

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the success criteria for this feature.
      placeholder: |
        - Criterion 1
        - Criterion 2
        - Criterion 3
    validations:
      required: true

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      description: List any assumptions.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related Epics, Stories, systems or teams.

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: High-level implementation guidance.

  ######################################################################
  # Completion Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Feature Checklist
      options:
        - label: Business problem defined
        - label: Business value documented
        - label: Functional requirements completed
        - label: Non-functional requirements reviewed
        - label: Acceptance criteria approved
        - label: Dependencies identified
        - label: Implementation approach reviewed
