name: "Change Request"
description: "Request a change to an application, platform or infrastructure"
title: "[Change]: "

labels:
  - "type:change-request"

body:

  - type: markdown
    attributes:
      value: |
        # Change Request

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header (Common to ALL Issue Types)
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Change Request Details
  ######################################################################

  - type: textarea
    id: change_summary
    attributes:
      label: Change Summary
      description: Describe the requested change.
    validations:
      required: true

  - type: textarea
    id: business_justification
    attributes:
      label: Business Justification
      description: Why is this change required?
    validations:
      required: true

  - type: textarea
    id: implementation_plan
    attributes:
      label: Implementation Plan
      description: Describe how the change will be implemented.
    validations:
      required: true

  - type: textarea
    id: impact_assessment
    attributes:
      label: Impact Assessment
      description: Describe the expected impact of this change.
    validations:
      required: true

  - type: textarea
    id: risk_assessment
    attributes:
      label: Risk Assessment
      description: Describe technical, operational and business risks.
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: Rollback Plan
      description: Describe how the change can be reversed if required.
    validations:
      required: true

  - type: textarea
    id: validation_plan
    attributes:
      label: Validation Plan
      description: Describe how success will be verified.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues, systems or external dependencies.

  ######################################################################
  # Approval Checklist
  ######################################################################

  - type: checkboxes
    id: approvals
    attributes:
      label: Change Readiness Checklist
      options:
        - label: Business justification documented
        - label: Impact assessed
        - label: Risk assessment completed
        - label: Rollback plan documented
        - label: Validation plan documented
        - label: Stakeholders informed
        - label: Implementation approved
