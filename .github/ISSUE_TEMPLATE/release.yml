name: "Release"
description: "Plan and track a software release"
title: "[Release]: "

labels:
  - "type:release"

body:

  - type: markdown
    attributes:
      value: |
        # Release

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Release Details
  ######################################################################

  - type: input
    id: release_version
    attributes:
      label: Release Version
      description: Version identifier for this release.
      placeholder: v2.5.0
    validations:
      required: true

  - type: input
    id: release_date
    attributes:
      label: Planned Release Date
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: dropdown
    id: target_environment
    attributes:
      label: Target Environment
      options:
        - Development
        - Test
        - UAT
        - Production
    validations:
      required: true

  - type: textarea
    id: release_summary
    attributes:
      label: Release Summary
      description: Provide an overview of the release.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Release Scope
      description: Describe what is included in this release.
    validations:
      required: true

  - type: textarea
    id: included_work
    attributes:
      label: Included Work Items
      description: List Features, Bugs, Tasks and Change Requests.
      placeholder: |
        Feature #101

        Bug #102

        Enhancement #103

        Change Request #104

  - type: textarea
    id: deployment_plan
    attributes:
      label: Deployment Plan
      description: Describe the deployment process.
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: Rollback Plan
      description: Describe how the release will be rolled back if required.
    validations:
      required: true

  - type: textarea
    id: validation_plan
    attributes:
      label: Validation Plan
      description: Describe post-deployment validation activities.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Release Risks
      description: Document risks associated with this release.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List dependent systems or work items.

  ######################################################################
  # Release Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Release Readiness Checklist
      options:
        - label: Testing completed
        - label: Release notes prepared
        - label: Rollback plan documented
        - label: Deployment plan reviewed
        - label: Stakeholders informed
        - label: Production approval obtained
        - label: Post-deployment validation completed
