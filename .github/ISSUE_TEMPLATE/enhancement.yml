name: "Enhancement"
description: "Request an improvement to an existing capability"
title: "[Enhancement]: "

labels:
  - "type:enhancement"

body:

  - type: markdown
    attributes:
      value: |
        # Enhancement Request

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header (Common to ALL Issue Types)
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Enhancement Details
  ######################################################################

  - type: textarea
    id: current_capability
    attributes:
      label: Current Capability
      description: Describe the existing capability.
    validations:
      required: true

  - type: textarea
    id: proposed_enhancement
    attributes:
      label: Proposed Enhancement
      description: Describe the proposed improvement.
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Explain why this enhancement is valuable.
    validations:
      required: true

  - type: textarea
    id: expected_benefits
    attributes:
      label: Expected Benefits
      description: Describe the expected outcomes.
      placeholder: |
        Improved performance
        Better usability
        Lower operational cost
        Improved reliability

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the success criteria.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues, systems or prerequisites.

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: Technical implementation guidance.

  - type: textarea
    id: test_plan
    attributes:
      label: Test Plan
      description: Describe how the enhancement will be validated.

  ######################################################################
  # Completion Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Enhancement Checklist
      options:
        - label: Business value documented
        - label: Acceptance criteria defined
        - label: Technical approach reviewed
        - label: Test plan completed
        - label: Documentation updated
