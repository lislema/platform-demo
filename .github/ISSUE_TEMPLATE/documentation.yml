name: "Documentation"
description: "Create or update project documentation"
title: "[Documentation]: "

labels:
  - "type:documentation"

body:

  - type: markdown
    attributes:
      value: |
        # Documentation Request

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header (Common to ALL Issue Types)
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Documentation Details
  ######################################################################

  - type: dropdown
    id: document_type
    attributes:
      label: Document Type
      options:
        - Architecture Document
        - API Documentation
        - Design Document
        - User Guide
        - Operations Guide
        - Runbook
        - Installation Guide
        - Developer Guide
        - Release Notes
        - ADR
        - README
        - Wiki
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Documentation Request
      description: Describe the documentation to be created or updated.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this documentation achieve?
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: Target Audience
      description: Who is this documentation intended for?
      placeholder: |
        Developers
        Platform Engineers
        Operations
        Security
        End Users

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what is in scope and out of scope.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Existing documentation, ADRs, specifications or external references.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define how completion will be measured.
    validations:
      required: true

  ######################################################################
  # Completion Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Documentation Checklist
      options:
        - label: Documentation created or updated
        - label: Technical review completed
        - label: Links validated
        - label: Screenshots updated (if applicable)
        - label: Examples verified
        - label: Grammar and spelling reviewed
        - label: Published to the correct location
