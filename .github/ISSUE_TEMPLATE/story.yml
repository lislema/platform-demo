name: "Story"
description: "Create a user story"
title: "[Story]: "

labels:
  - "type:story"

body:

  - type: markdown
    attributes:
      value: |
        # User Story

        A Story represents a user requirement that contributes to a Feature
        and is implemented through one or more Tasks.

        ---
        ## Enterprise Header

        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Business priority.
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  ######################################################################
  # Story Details
  ######################################################################

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Describe the requirement using the standard user story format.
      placeholder: |
        As a...

        I want...

        So that...
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Describe the value delivered by this story.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the acceptance criteria.
      placeholder: |
        - Criterion 1
        - Criterion 2
        - Criterion 3
    validations:
      required: true

  - type: textarea
    id: business_rules
    attributes:
      label: Business Rules
      description: Describe any business rules or constraints.

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      description: List assumptions.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related Features, Stories, Tasks or external dependencies.

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: High-level implementation guidance for developers.

  - type: textarea
    id: test_scenarios
    attributes:
      label: Test Scenarios
      description: Describe the scenarios that should be tested.
      placeholder: |
        Scenario 1

        Scenario 2

        Scenario 3

  ######################################################################
  # Completion Checklist
  ######################################################################

  - type: checkboxes
    id: checklist
    attributes:
      label: Story Checklist
      options:
        - label: User story defined
        - label: Business value documented
        - label: Acceptance criteria agreed
        - label: Business rules reviewed
        - label: Dependencies identified
        - label: Test scenarios documented
