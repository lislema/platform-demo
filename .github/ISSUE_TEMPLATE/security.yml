name: "Security"
description: "Report a security vulnerability or security-related issue"
title: "[Security]: "

labels:
  - "type:security"

body:

  - type: markdown
    attributes:
      value: |
        # Security Issue

        Complete all mandatory fields before submitting.

        ## Enterprise Header

        The first five fields are mandatory for every engineering work item.

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: AI Gateway
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: AIR-123456
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Business priority.
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the affected component.
      options:
        - component:api
        - component:backend
        - component:frontend
        - component:database
        - component:infrastructure
        - component:ci-cd
        - component:security
        - component:testing
        - component:ai
        - component:ai-agent
        - component:documentation
        - component:other
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Security Details

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Security impact.
      options:
        - severity:critical
        - severity:high
        - severity:medium
        - severity:low
    validations:
      required: true

  - type: dropdown
    id: security_category
    attributes:
      label: Security Category
      description: Select the security issue category.
      options:
        - AI and LLM Security
        - API Security
        - Application Security
        - Authentication
        - Authorization
        - Cloud Security
        - Compliance
        - Configuration
        - Container Security
        - Cryptography
        - Data Protection
        - Dependency Vulnerability
        - Identity and Access Management
        - Infrastructure Security
        - Kubernetes Security
        - Malware
        - Network Security
        - Secrets Management
        - Supply Chain Security
        - Other
    validations:
      required: true

  - type: textarea
    id: security_summary
    attributes:
      label: Security Summary
      description: Brief description of the issue.
    validations:
      required: true

  - type: textarea
    id: technical_description
    attributes:
      label: Technical Description
      description: Describe the vulnerability or security issue in detail.
    validations:
      required: true

  - type: textarea
    id: affected_assets
    attributes:
      label: Affected Assets
      description: Systems, services, APIs, infrastructure or repositories affected.
    validations:
      required: true

  - type: textarea
    id: business_impact
    attributes:
      label: Business Impact
      description: Describe the potential impact to the business.
    validations:
      required: true

  - type: textarea
    id: technical_impact
    attributes:
      label: Technical Impact
      description: Describe the technical impact.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe how the issue can be reproduced.
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, scanner output, CVE references or proof of concept.
      render: shell

  - type: textarea
    id: proposed_mitigation
    attributes:
      label: Proposed Mitigation
      description: Describe the recommended remediation.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: CVE, CWE, OWASP, NIST or vendor advisories.

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Security Checklist
      options:
        - label: Business impact assessed
        - label: Technical impact assessed
        - label: Evidence attached
        - label: Mitigation proposed
        - label: Security team notified
        - label: Related issues linked
